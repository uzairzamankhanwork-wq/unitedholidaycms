<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard - United Holidays</title>
<link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><img src="/assets/logo.png" alt="" onerror="this.style.display='none'" /> United Holidays</div>
      <nav id="sidebar-nav">
        <a href="#dashboard" data-route="dashboard">📊 Dashboard</a>
        <a href="#homepage" data-route="homepage">🏠 Homepage</a>
        <a href="#destinations" data-route="destinations">🌍 Destinations</a>
        <a href="#visa" data-route="visa">🛂 Visa Services</a>
        <a href="#about" data-route="about">ℹ️ About</a>
        <a href="#testimonials" data-route="testimonials">💬 Testimonials</a>
        <a href="#faqs" data-route="faqs">❓ FAQs</a>
        <a href="#contact" data-route="contact">📞 Contact</a>
        <a href="#footer" data-route="footer">📄 Footer</a>
        <a href="#settings" data-route="settings">⚙️ Site Settings</a>
      </nav>
      <div class="logout-row">
        <a href="/admin/logout" class="btn btn-outline btn-block" style="color:#fff;border-color:rgba(255,255,255,0.25);">Logout</a>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:0.75rem;">
          <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">☰</button>
          <h2 id="page-title">Dashboard</h2>
        </div>
        <a href="/" target="_blank" class="btn btn-secondary btn-sm">View Website ↗</a>
      </div>
      <div class="content" id="content">
        <!-- rendered by dashboard.js -->
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div class="toast" id="toast"></div>

  <script src="/admin/assets/dashboard.js"></script>
</body>
</html>
